<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Merry Christmas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="xmas">

  <!-- Tiêu đề -->
  <div class="to">
    <div class="title-wrapper">
      <span class="tree">🎄</span>
      <h1 class="headline">Merry Christmas</h1>
      <span class="tree">🎄</span>
    </div>

    <!-- Nội dung chính: ornament trái – cây thông phải -->
    <div class="content-row">
      <div class="left-col">
        <div class="ornament-wrapper">
          <div class="xmas-ornament red">
            Chúc cậu<br>Giáng sinh <br>vui vẻ nho!
          </div>
          <div class="xmas-ornament blue">
            2025
          </div>
        </div>
      </div>

      <div class="right-col">
        <img src="screenshot/Capture.png" class="tree-img" alt="Christmas Tree">
      </div>
    </div>

    <br> <br> <br> <br> <br> <br> <br> <br> <br>
    <!-- Chữ from -->
    <div class="from">
      from <span class="from-name">Koby</span>
    </div>
  </div>

  <!-- Canvas tuyết -->
  <canvas id="xmas"></canvas>

</section>


<script src="script.js"></script>
</body>
</html>
